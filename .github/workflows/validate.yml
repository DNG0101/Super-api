name: Validate Super API Lab

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.js' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Capability OS core matrix
        run: node tests/capability-os-core.test.cjs
      - name: UCOS fabric core matrix
        run: node tests/ucos-fabric-core.test.cjs
      - name: UCOS runtime core matrix
        run: node tests/ucos-runtime-core.test.cjs
      - name: UCOS workflow core matrix
        run: node tests/ucos-workflow-core.test.cjs
      - name: Capability OS architecture audit
        run: node .github/scripts/capability-os-audit.mjs
      - name: Universal protocol test matrix
        run: node tests/universal-core.test.cjs
      - name: Network and signal test matrix
        run: node tests/network-signal-core.test.cjs
      - name: Wireless radio test matrix
        run: node tests/wireless-radio-core.test.cjs
      - name: Wireless radio wiring audit
        run: node .github/scripts/wireless-audit.mjs
      - name: Repository wiring audit
        run: node .github/scripts/static-audit.mjs
      - name: Manifest JSON
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); if(m.name!=='Super API UCOS') throw new Error('UCOS manifest identity missing'); console.log('manifest valid')"
      - name: HTML local script references
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.src=[]; self.href=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src','').startswith('./'): self.src.append(a['src'][2:])
                  if tag=='link' and a.get('href','').startswith('./'): self.href.append(a['href'][2:])
          p=P(); p.feed(Path('index.html').read_text())
          refs=p.src+p.href
          missing=[x for x in refs if not Path(x).exists()]
          duplicates=sorted({x for x in refs if refs.count(x)>1})
          print('Referenced local assets:', len(refs))
          print('Scripts:', *p.src, sep='\n- ')
          if missing: raise SystemExit('Missing local references: '+', '.join(missing))
          if duplicates: raise SystemExit('Duplicate local references: '+', '.join(duplicates))
      - name: Service worker core assets
        shell: python
        run: |
          import re
          from pathlib import Path
          text=Path('sw.js').read_text()
          m=re.search(r"const CORE=\[(.*?)\];", text, re.S)
          if not m: raise SystemExit('CORE cache list not found')
          items=re.findall(r"'([^']+)'",m.group(1))
          missing=[]
          for item in items:
              if item in ('.','./'): continue
              path=item[2:] if item.startswith('./') else item
              if not Path(path).exists(): missing.append(path)
          if missing: raise SystemExit('Missing SW core assets: '+', '.join(missing))
          for required in ['modules/ucos-runtime-core.js','modules/ucos-vfs.js','modules/ucos-workflow-core.js','modules/ucos-workflows.js','modules/ucos-runtime.js','modules/ucos-v4-integration.js','modules/ucos-jobs.js','runtime/app-frame.html','runtime/app-frame.js']:
              if './'+required not in items: raise SystemExit('UCOS v4 asset not cached: '+required)
          print('Service worker core assets valid:', len(items))
      - name: Capability OS headless browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/super-api-http.log 2>&1 &
          SERVER_PID=$!
          CHROME_PID=''
          CHROME_PROFILE=''
          cleanup(){
            if [ -n "$CHROME_PID" ]; then kill "$CHROME_PID" 2>/dev/null || true; fi
            kill "$SERVER_PID" 2>/dev/null || true
            if [ -n "$CHROME_PROFILE" ]; then rm -rf "$CHROME_PROFILE" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo 'No Chromium-compatible browser on runner' >&2; exit 1; fi
          run_dump(){
            local url="$1" out="$2" budget="$3" marker="$4" name="$5"
            local attempt profile err
            for attempt in 1 2; do
              profile="$(mktemp -d)"
              err="/tmp/${name}-${attempt}.err"
              echo "Browser smoke ${name}, attempt ${attempt}"
              if timeout 60s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --user-data-dir="$profile" --virtual-time-budget="$budget" --dump-dom "$url" >"$out" 2>"$err"; then
                rm -rf "$profile"
                if grep -q "$marker" "$out"; then return 0; fi
                echo "Marker ${marker} missing on attempt ${attempt}" >&2
              else
                echo "Chromium did not complete ${name} on attempt ${attempt}" >&2
              fi
              rm -rf "$profile"
              tail -n 60 "$err" >&2 || true
              sleep 1
            done
            echo "Final DOM for ${name}:" >&2
            tail -n 120 "$out" >&2 || true
            return 1
          }
          run_dump http://127.0.0.1:8765/tests/capability-os-browser-smoke.html /tmp/capability-smoke.html 3000 CAPABILITY_OS_BROWSER_PASS capability-core
          run_dump http://127.0.0.1:8765/tests/capability-os-runtime-smoke.html /tmp/capability-runtime-smoke.html 5000 CAPABILITY_OS_RUNTIME_PASS capability-runtime
          run_dump http://127.0.0.1:8765/tests/ucos-fabric-browser-smoke.html /tmp/ucos-fabric-smoke.html 9000 UCOS_FABRIC_BROWSER_PASS ucos-v4
          grep -q 'UCOS_V4_BROWSER_PASS' /tmp/ucos-fabric-smoke.html
          echo 'Running the actual production index through CDP responsiveness checks...'
          CHROME_PROFILE="$(mktemp -d)"
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-background-networking --no-first-run --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --user-data-dir="$CHROME_PROFILE" about:blank >/tmp/production-chrome.out 2>/tmp/production-chrome.err &
          CHROME_PID=$!
          node tests/production-browser-smoke.mjs http://127.0.0.1:8765/index.html 9222
          echo 'Actual production index loaded, initialized, and responded on its main thread'
