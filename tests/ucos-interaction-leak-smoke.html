 await Runtime.installManifest({id:'leak.crash',name:'Leak Crash',version:'1.0.0',runtime:'sandbox',entry:'tests/fixtures/ucos-sandbox-app.js',capabilities:[],lifecycle:{autoRestart:false}});const mount=d.createElement('div');d.body.append(mount);const handle=Runtime.attachSandbox('leak.crash',mount);const ownedBefore=Runtime.resources.list(handle.pid).length;if(ownedBefore<3)throw new Error('sandbox-resource-precondition');Runtime.crashProcess(handle.pid,'interaction-leak-smoke');await wait(()=>!Runtime.listProcesses().some(p=>p.pid===handle.pid),'crash-cleanup',3000);if(Runtime.resources.list(handle.pid).length!==0)throw new Error('crashed-sandbox-resources-leaked');mount.remove();await Runtime.uninstall('leak.crash');
