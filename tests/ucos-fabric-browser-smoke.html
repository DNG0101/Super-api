<!doctype html>
<html><head><meta charset="utf-8"><title>UCOS Fabric smoke</title></head>
<body>
<button id="hostBtn" class="primary">host</button><button id="controllerBtn">controller</button><input id="allowRequests" type="checkbox" checked>
<select id="remoteAction"><option value="environment-info">Environment</option><option value="ext:test">Extension test</option></select>
<main><section id="legacyLab">legacy lab preserved</section></main><div id="sandboxMount"></div><pre id="result">running</pre>
<script src="../modules/capability-os-core.js"></script>
<script>
window.__superApiTrackedChannels=new Set();
window.SuperApiCapabilityOS={
 discoverActions(){return{total:2}},
 catalog(){return[
  {id:'action:environment-info',domain:'web',name:'environment-info',label:'Environment',operations:['execute','test'],metadata:{action:'environment-info'}},
  {id:'action:ext:test',domain:'diagnostics',name:'ext:test',label:'Extension test',operations:['execute','test'],metadata:{action:'ext:test'}}
 ]},
 async execute(input){return{result:{compatibility:true,mode:input.mode,capabilityId:input.capabilityId}}}
};
window.SUPER_API_EXT_HANDLE=()=>{};
</script>
<script src="../modules/ucos-fabric-core.js"></script>
<script src="../modules/ucos-storage.js"></script>
<script src="../modules/ucos-fabric.js"></script>
<script src="../modules/ucos-lifecycle.js"></script>
<script src="../modules/ucos-security-core.js"></script>
<script src="../modules/ucos-security.js"></script>
<script src="../modules/ucos-vault.js"></script>
<script src="../modules/ucos-secure-peer.js"></script>
<script src="../modules/ucos-runtime-core.js"></script>
<script src="../modules/ucos-vfs.js"></script>
<script src="../modules/ucos-workflow-core.js"></script>
<script src="../modules/ucos-workflows.js"></script>
<script src="../modules/ucos-runtime.js"></script>
<script src="../modules/ucos-shell.js"></script>
<script src="../modules/ucos-v4-integration.js"></script>
<script src="../modules/ucos-update.js"></script>
<script src="../modules/ucos-v5-integration.js"></script>
<script>
(async()=>{
 try{
  if(!window.SuperApiUCOS)throw new Error('SuperApiUCOS missing');
  if(!window.SuperApiUCOSRuntime)throw new Error('UCOS runtime missing');
  if(!window.SuperApiUCOSVFS)throw new Error('UCOS VFS missing');
  if(!window.SuperApiUCOSWorkflows)throw new Error('UCOS workflows missing');
  if(!window.SuperApiUCOSV4)throw new Error('UCOS v4 integration missing');
  if(!window.SuperApiUCOSSecurity)throw new Error('UCOS security missing');
  if(!window.SuperApiUCOSVault)throw new Error('UCOS vault missing');
  if(!window.SuperApiUCOSSecurePeer)throw new Error('UCOS secure peer missing');
  if(!window.SuperApiUCOSLifecycle)throw new Error('UCOS lifecycle missing');
  if(!window.SuperApiUCOSV5)throw new Error('UCOS v5 integration missing');
  if(!document.querySelector('#ucosOS'))throw new Error('UCOS full-screen shell missing');
  if(!document.body.classList.contains('ucos-os-active'))throw new Error('UCOS shell did not become primary viewport');
  if(!document.querySelector('#ucosDesktop'))throw new Error('UCOS desktop missing');
  if(!document.querySelector('#ucosDock'))throw new Error('UCOS dock missing');
  if(!document.querySelector('#ucosLauncherOverlay'))throw new Error('UCOS launcher missing');
  if(!document.querySelector('#legacyLab'))throw new Error('legacy lab was removed');
  const h=SuperApiUCOS.health();
  if(h.capabilities.total<2)throw new Error('capabilities not mirrored');
  if(h.providers.length<2)throw new Error('providers missing');
  if(h.transports.length<3)throw new Error('secure transport missing');
  const ident=await SuperApiUCOSSecurity.ready;if(!ident?.deviceId?.startsWith('dev-'))throw new Error('cryptographic device identity missing');
  const vaultHealth=await SuperApiUCOSVault.ready;if(vaultHealth.algorithm!=='AES-GCM'||vaultHealth.keyExtractable!==false)throw new Error('vault master key is not non-exportable AES-GCM');
  await SuperApiUCOSVault.set('smoke.secret',{token:'not-plaintext-at-rest',n:5},{metadata:{purpose:'smoke'}});
  const secret=await SuperApiUCOSVault.get('smoke.secret');if(secret?.token!=='not-plaintext-at-rest'||secret?.n!==5)throw new Error('vault encrypt/decrypt failed');
  if(!(await SuperApiUCOSVault.list()).some(x=>x.name==='smoke.secret'&&x.metadata?.purpose==='smoke'))throw new Error('vault metadata listing failed');
  const rotated=await SuperApiUCOSVault.rotate();if(!rotated.rotated||rotated.secrets<1||(await SuperApiUCOSVault.get('smoke.secret'))?.n!==5)throw new Error('vault master rotation failed');
  await SuperApiUCOSVault.remove('smoke.secret');if(await SuperApiUCOSVault.get('smoke.secret')!==null)throw new Error('vault delete failed');
  const env=await SuperApiUCOS.execute({capabilityId:'action:environment-info',operation:'execute',mode:'local'});
  if(!env.ok||!env.result)throw new Error('local provider execution failed');

  class FakeChannel extends EventTarget{
   constructor(name){super();this.name=name;this.readyState='open';this.sent=[]}
   send(payload){const msg=JSON.parse(payload);this.sent.push(msg);if(msg.type==='request')queueMicrotask(()=>this.dispatchEvent(new MessageEvent('message',{data:JSON.stringify({type:'result',id:msg.id,result:{servedBy:this.name}})})))}
  }
  const a=new FakeChannel('peer-a-channel'),b=new FakeChannel('peer-b-channel');
  window.__superApiTrackedChannels.add(a);window.__superApiTrackedChannels.add(b);
  a.dispatchEvent(new MessageEvent('message',{data:JSON.stringify({type:'ucos:hello',node:{id:'peer-a',label:'Peer A',kind:'browser',online:true}})}));
  b.dispatchEvent(new MessageEvent('message',{data:JSON.stringify({type:'ucos:hello',node:{id:'peer-b',label:'Peer B',kind:'browser',online:true}})}));
  for(const [ch,id,label] of [[a,'peer-a','Peer A'],[b,'peer-b','Peer B']])ch.dispatchEvent(new MessageEvent('message',{data:JSON.stringify({type:'ucos:advertise',node:{id,label,kind:'browser',online:true,capabilities:['action:ext:test'],capabilityDetails:[{id:'action:ext:test',domain:'diagnostics',operations:['execute']}]}})}));
  if(SuperApiUCOS.channelForNode('peer-a')!==a||SuperApiUCOS.channelForNode('peer-b')!==b)throw new Error('peer-specific channel mapping failed');
  let unsignedBlocked=false;try{await SuperApiUCOS.execute({capabilityId:'action:ext:test',operation:'execute',mode:'peer',targetNodeId:'peer-a'})}catch(e){unsignedBlocked=/trusted|secure/i.test(e.message)}if(!unsignedBlocked)throw new Error('unsigned peer downgrade was not blocked by default');
  const remote=await SuperApiUCOS.execute({capabilityId:'action:ext:test',operation:'execute',mode:'peer',targetNodeId:'peer-a',meta:{allowLegacyPeer:true}});
  if(remote.result?.servedBy!=='peer-a-channel')throw new Error('explicit legacy targetNodeId compatibility routing failed');

  await SuperApiUCOSRuntime.ready;
  if(SuperApiUCOSRuntime.manifests.size()<10)throw new Error('system app manifests not registered');
  await SuperApiUCOSVFS.init();
  await SuperApiUCOSVFS.writeAtomic('/home/smoke.txt','ucos-v5',{type:'text/plain'});
  if(await SuperApiUCOSVFS.readText('/home/smoke.txt')!=='ucos-v5')throw new Error('VFS atomic read/write failed');
  await SuperApiUCOSVFS.writeJSON('/home/data.json',{ok:true});if((await SuperApiUCOSVFS.readJSON('/home/data.json')).ok!==true)throw new Error('VFS JSON helpers failed');
  const range=await SuperApiUCOSVFS.readRange('/home/smoke.txt',0,4);if(await range.text()!=='ucos')throw new Error('VFS range read failed');
  await SuperApiUCOSVFS.copy('/home/smoke.txt','/tmp/smoke-copy.txt');if(!(await SuperApiUCOSVFS.stat('/tmp/smoke-copy.txt')))throw new Error('VFS copy failed');
  await SuperApiUCOSVFS.move('/tmp/smoke-copy.txt','/home/moved.txt');if(!(await SuperApiUCOSVFS.stat('/home/moved.txt')))throw new Error('VFS move failed');
  const trashed=await SuperApiUCOSVFS.trash('/home/moved.txt');if(!trashed?.path?.includes('/home/.Trash/'))throw new Error('VFS trash failed');await SuperApiUCOSVFS.emptyTrash();
  await SuperApiUCOSVFS.remove('/home/smoke.txt');await SuperApiUCOSVFS.remove('/home/data.json');

  const flow={id:'browser-smoke',steps:[{id:'a',type:'set',key:'ok',value:true},{id:'b',type:'condition',dependsOn:['a'],left:'${vars.ok}',operator:'eq',right:true}]};
  const run=await SuperApiUCOSWorkflows.run(flow,{});if(run.state!=='success')throw new Error('workflow execution failed');

  await SuperApiUCOSRuntime.installManifest({id:'sandbox.test',name:'Sandbox Test',version:'1.0.0',runtime:'sandbox',entry:'tests/fixtures/ucos-sandbox-app.js',capabilities:['action:environment-info','system.vfs','system.workflow']});
  await SuperApiUCOSRuntime.grants.set('sandbox.test','action:environment-info',{state:'granted',scope:'once'});
  const mount=document.querySelector('#sandboxMount');
  let handle;await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(new Error('sandbox app did not become ready')),7000);handle=SuperApiUCOSRuntime.attachSandbox('sandbox.test',mount,{onReady:()=>{clearTimeout(timer);resolve()},onCrash:m=>{clearTimeout(timer);reject(new Error(m.error||'sandbox crashed'))}})});
  const frame=handle.iframe;if(frame.getAttribute('sandbox')?.includes('allow-same-origin'))throw new Error('sandbox unexpectedly has same-origin privilege');
  const csp=await fetch(frame.src.split('#')[0]).then(r=>r.text());if(!csp.includes("require-trusted-types-for 'script'")||!csp.includes("default-src 'none'"))throw new Error('sandbox CSP/Trusted Types policy missing');
  if(await SuperApiUCOSVFS.readText('/apps/data/sandbox.test/note.txt')!=='sandbox-ok')throw new Error('sandbox private VFS IPC failed');
  if((await SuperApiUCOSRuntime.grants.check('sandbox.test','action:environment-info')).state!=='prompt')throw new Error('once capability grant was not consumed');
  if(!SuperApiUCOSRuntime.listProcesses().some(p=>p.pid===handle.pid&&p.state==='running'))throw new Error('sandbox process manager state missing');
  handle.suspend('smoke');if(!SuperApiUCOSRuntime.listProcesses().some(p=>p.pid===handle.pid&&p.state==='suspended'))throw new Error('sandbox suspend failed');handle.resume();if(!SuperApiUCOSRuntime.listProcesses().some(p=>p.pid===handle.pid&&p.state==='running'))throw new Error('sandbox resume failed');
  if(!SuperApiUCOSSecurity.audit.query({type:'capability-executed',appId:'sandbox.test'}).length)throw new Error('security audit did not record sandbox capability');
  await handle.close();await new Promise(r=>setTimeout(r,0));if(SuperApiUCOSRuntime.listProcesses().some(p=>p.pid===handle.pid))throw new Error('sandbox process/resource cleanup failed');
  await SuperApiUCOSVFS.remove('/apps/data/sandbox.test',{recursive:true});await SuperApiUCOSRuntime.uninstall('sandbox.test');

  await SuperApiUCOSV5.ready;if(SuperApiUCOSLifecycle.health().ready!==true)throw new Error('lifecycle did not mark boot ready');
  const v5h=await SuperApiUCOSV5.health();if(v5h.version!==5||!v5h.runtime||v5h.vault?.keyExtractable!==false)throw new Error('UCOS v5 health contract missing');
  document.querySelector('#result').textContent='UCOS_FABRIC_BROWSER_PASS UCOS_V4_BROWSER_PASS UCOS_V5_BROWSER_PASS';
 }catch(error){document.querySelector('#result').textContent='UCOS_FABRIC_BROWSER_FAIL '+error.message;throw error}
})();
</script>
</body></html>
